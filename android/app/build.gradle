plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def dartEnvironmentVariables = [
    "FLAVOR": "prod",
];
if (project.hasProperty('dart-defines')) {
    dartEnvironmentVariables = dartEnvironmentVariables + project.property('dart-defines')
        .split(',')
        .collectEntries { entry ->
            def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
            [(pair.first()): pair.last()]
        }
}

android {
    namespace = "com.hst.attendance_tracker"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.hst.attendance_tracker"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // for multiple firebase account(dev, staging, prod)- eg: com.hst.attendance_tracker.dev
        // if (dartEnvironmentVariables.FLAVOR != 'prod') {
        //     applicationIdSuffix ".${dartEnvironmentVariables.FLAVOR}"
        // }
        resValue "string", "app_name", "${dartEnvironmentVariables.APP_NAME}" +
        (dartEnvironmentVariables.FLAVOR == 'prod' ? '' : ".${dartEnvironmentVariables.FLAVOR}")
        resValue "string", "GOOGLE_API_KEY", dartEnvironmentVariables.GOOGLE_API_KEY ?: ""
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}


// Icon switching task
task copySources(type: Copy) {
    from "src/${dartEnvironmentVariables.FLAVOR}/res"
    into 'src/main/res'
}
tasks.whenTaskAdded { task ->
    task.dependsOn copySources
    if (task.name == 'generateDebugResources') {
        task.dependsOn copySources
    }
    if (task.name == 'generateReleaseResources') {
        task.dependsOn copySources
    }
}

// Task to switch google-services.json
task selectGoogleServicesJson(type: Copy) {
    from "src/${dartEnvironmentVariables.FLAVOR}/google-services.json"
    into './'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'processDebugGoogleServices' || task.name == 'processReleaseGoogleServices') {
        task.dependsOn selectGoogleServicesJson
    }
}

// Add task dependencies here
tasks.whenTaskAdded { task ->
    def selectGoogleServicesJsonTask = tasks.findByName("selectGoogleServicesJson")
    if (selectGoogleServicesJsonTask != null) {
        if (task.name == 'compileFlutterBuildDebug') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'mergeDebugAssets') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'mergeDebugShaders') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'extractDeepLinksDebug') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'mergeDebugJniLibFolders') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == "compileFlutterBuildRelease") {
            task.dependsOn "selectGoogleServicesJson"
        }
        if (task.name == "mergeReleaseAssets") {
            task.dependsOn "selectGoogleServicesJson"
        }
        if (task.name == "mergeReleaseShaders") {
            task.dependsOn "selectGoogleServicesJson"
        }
        if (task.name == 'extractDeepLinksRelease') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'mergeReleaseJniLibFolders') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'generateDebugResources') {
            task.dependsOn selectGoogleServicesJsonTask
        }
        if (task.name == 'generateReleaseResources') {
            task.dependsOn selectGoogleServicesJsonTask
        }
    }
}